<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deployr — Sign in</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./login.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <script>
    // Theme sync - default to light unless explicitly saved as dark
    const saved = localStorage.getItem("deployr.theme");
    if (saved) {
      document.documentElement.dataset.theme = saved;
    } else {
      document.documentElement.dataset.theme = "light";
    }

    function toggleTheme() {
      const current = document.documentElement.dataset.theme || "light";
      const next = current === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("deployr.theme", next);
    }
  </script>
</head>
<body>
  <!-- Theme Toggle Button -->
  <div class="theme-toggle-wrapper">
    <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <div class="login-card">
    <!-- Brand -->
    <div class="login-card__brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
          <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        </svg>
      </span>
      <div class="brand__text">
        <h1>Deployr</h1>
        <p>Wikimedia Toolforge deployment</p>
      </div>
    </div>

    <!-- Header info -->
    <div class="login-card__header">
      <p class="login-card__desc">
        One click deployment for wikimedia toolforge
      </p>
    </div>

    <!-- Error Banner (shown when ?error= present) -->
    <div class="error-banner" id="error-banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="error-message"></span>
    </div>

    <!-- Wikimedia OAuth Button -->
    <a href="/oauth/authorize" class="btn btn--primary login-card__btn" id="btn-sign-in">
      Sign in with Wikimedia
    </a>
  </div>

  <script>
    // Wire theme toggle button
    document.getElementById("themeToggle").addEventListener("click", toggleTheme);

    // Map error codes from /callback to human-readable messages
    const ERROR_MESSAGES = {
      session_expired:       "Your login session expired. Please try signing in again.",
      access_denied:         "You declined access. Sign in again when you're ready.",
      no_code:               "No authorization code was received from Wikimedia.",
      token_exchange_failed: "Could not exchange the authorization code for a token. Please try again.",
      profile_fetch_failed:  "Signed in, but couldn't fetch your Wikimedia profile. Please try again.",
      invalid_profile:       "Your Wikimedia profile returned incomplete data. Please try again.",
      jwt_mint_failed:       "Internal error creating your session token. Please try again.",
    };

    (function showErrorIfPresent() {
      const params = new URLSearchParams(window.location.search);
      const code   = params.get("error");
      if (!code) return;

      const msg    = ERROR_MESSAGES[code] || `Authentication error: ${code}`;
      const banner = document.getElementById("error-banner");
      document.getElementById("error-message").textContent = msg;
      banner.classList.add("visible");

      // Remove the ?error= from the URL bar without triggering a reload
      history.replaceState(null, "", window.location.pathname);
    })();
  </script>
</body>
</html>
